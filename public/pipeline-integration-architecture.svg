<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- 背景点阵网格 -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>

    <!-- 箭头标记 -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>

    <!-- 发光滤镜 -->
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 网格底纹 -->
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- 顶部主标题 -->
  <text x="50" y="48" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">NetDive 狗粮落地架构：Ghost 炼化与 Tachikoma 摄入全链路控制拓扑</text>
  <text x="50" y="74" fill="#94a3b8" font-size="12">零业务代码侵入 · 极轻量 Fail-Silent 探针 · 跨进程 Promise 人机决策硬门禁</text>

  <!-- ==================== 区域 1: 外部业务生产运行时 (Ghost / Tachikoma) ==================== -->
  <g id="runtime-zone">
    <!-- 区域外框 -->
    <rect x="50" y="110" width="1100" height="210" rx="12" fill="#131e36" stroke="#334155" stroke-dasharray="6 6" />
    <text x="75" y="140" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">业务数据面：本地流水线运行时 (Data Plane &amp; Workflows)</text>

    <!-- 卡片 1: Tachikoma 统一情报摄入 -->
    <rect x="75" y="160" width="320" height="135" rx="8" fill="rgba(8,51,68,0.4)" stroke="#0e7490" stroke-width="1.5" />
    <rect x="75" y="160" width="320" height="30" rx="8" fill="rgba(14,116,144,0.3)" />
    <circle cx="95" cy="175" r="4" fill="#22d3ee" />
    <text x="110" y="180" fill="#e0f2fe" font-size="12" font-weight="600">Tachikoma 抓取链路 (ingest)</text>
    <text x="95" y="210" fill="#94a3b8" font-size="11">① Tier 1 Fast-HTTP 直通抓取</text>
    <text x="95" y="232" fill="#94a3b8" font-size="11">② 遇到反爬 ➔ 自动降级无头浏览器 (Puppeteer)</text>
    <text x="95" y="254" fill="#94a3b8" font-size="11">③ LLM 提纯 6+1 MOC 标签 ➔ 落盘 _raw/articles/</text>
    <text x="95" y="278" fill="#38bdf8" font-size="10" font-family="monospace">reporter.step('tachikoma_fetch')</text>

    <!-- 卡片 2: Ghost 知识库炼化与治理 -->
    <rect x="430" y="160" width="370" height="135" rx="8" fill="rgba(76,29,149,0.25)" stroke="#6d28d9" stroke-width="1.5" />
    <rect x="430" y="160" width="370" height="30" rx="8" fill="rgba(109,40,217,0.3)" />
    <circle cx="450" cy="175" r="4" fill="#c084fc" />
    <text x="465" y="180" fill="#ede9fe" font-size="12" font-weight="600">Ghost 知识库炼化 (pipeline.ts)</text>
    <text x="450" y="210" fill="#94a3b8" font-size="11">① 读取 _raw/ 素材 ➔ LLM 提纯实体与双链</text>
    <text x="450" y="232" fill="#94a3b8" font-size="11">② L1 出厂断言 (validator.ts 校验 YAML Schema)</text>
    <text x="450" y="254" fill="#94a3b8" font-size="11">③ 嗅探近义词 ➔ 自愈分支 (概念退火或合并)</text>
    <text x="450" y="278" fill="#a78bfa" font-size="10" font-family="monospace">reporter.step('ghost_distill_and_validate')</text>

    <!-- 卡片 3: NetDive 零依赖 Fail-Silent 探针 (核心关键中间件) -->
    <rect x="835" y="160" width="290" height="135" rx="8" fill="rgba(6,78,59,0.3)" stroke="#059669" stroke-width="1.5" />
    <rect x="835" y="160" width="290" height="30" rx="8" fill="rgba(5,150,105,0.3)" />
    <circle cx="855" cy="175" r="4" fill="#34d399" />
    <text x="870" y="180" fill="#d1fae5" font-size="12" font-weight="600">netdive-reporter 零侵入中间件</text>
    <text x="855" y="210" fill="#6ee7b7" font-size="11">✔ 零依赖、纯原生 Node/TS 模块</text>
    <text x="855" y="232" fill="#6ee7b7" font-size="11">✔ Fail-Silent：NetDive 没开时 0 报错静默跳过</text>
    <text x="855" y="254" fill="#fbbf24" font-size="11">✔ 遇到批量退火/写盘 ➔ 触发 gate() 挂起</text>
    <text x="855" y="278" fill="#94a3b8" font-size="10" font-family="monospace">await reporter.gate({ action: 'wiki_write' })</text>
  </g>

  <!-- 连线：业务层 -> 探针中间件 -->
  <path d="M 395 220 L 835 220" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-cyan)" />
  <path d="M 800 240 L 835 240" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-purple)" />

  <!-- ==================== 垂直传输通道 (HTTP / WebSocket 桥接) ==================== -->
  <!-- 左通道：异步遥测事件流 -->
  <path d="M 910 295 L 910 380 L 420 380 L 420 420" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <rect x="520" y="368" width="220" height="24" rx="4" fill="#064e3b" stroke="#059669" />
  <text x="530" y="384" fill="#a7f3d0" font-size="11" font-family="monospace">POST /api/telemetry (单向异步流)</text>

  <!-- 右通道：双向阻塞挂起与裁决 (HITL) -->
  <path d="M 1050 295 L 1050 420" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-rose)" />
  <rect x="940" y="340" width="210" height="42" rx="4" fill="rgba(136,19,55,0.4)" stroke="#e11d48" filter="url(#glow-rose)" />
  <text x="950" y="357" fill="#fecdd3" font-size="11" font-weight="600">POST /api/gate/prompt</text>
  <text x="950" y="373" fill="#fda4af" font-size="10">跨进程挂起 (等待前端批准再写盘)</text>

  <!-- ==================== 区域 2: 控制平面 (NetDive 控制台) ==================== -->
  <g id="control-zone">
    <!-- 控制台大框 -->
    <rect x="50" y="420" width="1100" height="220" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="50" y="420" width="1100" height="34" rx="12" fill="#334155" />
    <circle cx="70" cy="437" r="4" fill="#fb7185" />
    <circle cx="85" cy="437" r="4" fill="#fbbf24" />
    <circle cx="100" cy="437" r="4" fill="#34d399" />
    <text x="120" y="442" fill="#f8fafc" font-size="12" font-weight="600">NetDive 控制平面与第二屏幕实时拓扑 (http://localhost:5173 - Port 4560)</text>

    <!-- 节点 1: Tachikoma 抓取节点 -->
    <rect x="80" y="480" width="180" height="130" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="95" y="505" fill="#38bdf8" font-size="12" font-weight="600">Tachikoma 抓取</text>
    <text x="95" y="530" fill="#94a3b8" font-size="11">耗时: 142ms</text>
    <text x="95" y="550" fill="#94a3b8" font-size="11">状态: HTTP 200</text>
    <rect x="95" y="570" width="75" height="22" rx="4" fill="#0369a1" />
    <text x="105" y="585" fill="#f0f9ff" font-size="10">Tier-1 直通</text>

    <!-- 箭头 1 -> 2 -->
    <path d="M 260 545 L 310 545" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />

    <!-- 节点 2: LLM 提纯与标签 -->
    <rect x="310" y="480" width="180" height="130" rx="8" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5" />
    <text x="325" y="505" fill="#c084fc" font-size="12" font-weight="600">LLM 提纯与分类</text>
    <text x="325" y="530" fill="#94a3b8" font-size="11">Token: 1.2k</text>
    <text x="325" y="550" fill="#94a3b8" font-size="11">标签: #架构 #可观测</text>
    <rect x="325" y="570" width="105" height="22" rx="4" fill="#581c87" />
    <text x="333" y="585" fill="#f3e8ff" font-size="10">五大支柱分类完毕</text>

    <!-- 箭头 2 -> 3 -->
    <path d="M 490 545 L 540 545" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- 节点 3: L1 确定性硬断言 (质检) -->
    <rect x="540" y="480" width="190" height="130" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="555" y="505" fill="#34d399" font-size="12" font-weight="600">L1 Schema 出厂质检</text>
    <text x="555" y="530" fill="#94a3b8" font-size="11">校验 YAML 元数据</text>
    <text x="555" y="550" fill="#94a3b8" font-size="11">双链有效性检查: 100%</text>
    <rect x="555" y="570" width="90" height="22" rx="4" fill="#047857" />
    <text x="565" y="585" fill="#ecfdf5" font-size="10">断言通过 0 报错</text>

    <!-- 箭头 3 -> 4 (高危审批分叉) -->
    <path d="M 730 545 L 780 545" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- 节点 4: 高危决策门禁卡片 (红色警示与审批按钮) -->
    <rect x="780" y="465" width="340" height="155" rx="8" fill="rgba(69,10,10,0.6)" stroke="#e11d48" stroke-width="2" filter="url(#glow-rose)" />
    <rect x="780" y="465" width="340" height="28" rx="8" fill="#881337" />
    <text x="795" y="484" fill="#ffe4e6" font-size="11" font-weight="700">🛑 人机协同决策门禁 (HITL Gate Pending)</text>
    <text x="795" y="515" fill="#fca5a5" font-size="11">检测到高危写盘动作: 更新 3 个 MOC 索引与 12 条双链</text>
    <text x="795" y="535" fill="#e2e8f0" font-size="10" font-family="monospace">Target: wiki/learning/可观测性.md</text>

    <!-- 模拟审批按钮 -->
    <rect x="795" y="560" width="130" height="34" rx="6" fill="#10b981" />
    <text x="820" y="582" fill="#ffffff" font-size="11" font-weight="700">✔ 批准物理写盘</text>

    <rect x="940" y="560" width="100" height="34" rx="6" fill="#475569" />
    <text x="965" y="582" fill="#ffffff" font-size="11" font-weight="600">✖ 拒绝中止</text>
  </g>
</svg>
